# Analysis & lint configuration for the TechWiz 7 starter project.
# Goal: catch real bugs fast during a 5-day competition without being
# so strict it slows the team down.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: false

  errors:
    # Treat these as errors instead of warnings/hints so they surface
    # immediately during `dart analyze` / IDE checks.
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "lib/generated_plugin_registrant.dart"

linter:
  rules:
    # --- Style / consistency ---
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_final_fields: true
    unnecessary_this: true
    curly_braces_in_flow_control_structures: true
    sort_child_properties_last: true
    always_declare_return_types: true

    # --- Safety / correctness ---
    avoid_print: true
    avoid_returning_null_for_future: true
    avoid_void_async: true
    cancel_subscriptions: true
    close_sinks: true
    no_logic_in_create_state: true
    use_build_context_synchronously: true

    # --- Architecture hygiene ---
    directives_ordering: true
    avoid_relative_lib_imports: true
    package_api_docs: false
